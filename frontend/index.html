<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/notegenio_favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NoteGenio — AI-powered document notebook. Upload sources, ask questions, get cited answers." />
    <title>NoteGenio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        var isDay = saved ? saved === 'day' : (new Date().getHours() >= 6 && new Date().getHours() < 18);
        document.documentElement.setAttribute('data-theme', isDay ? 'day' : 'night');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
